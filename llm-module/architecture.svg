<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="960" height="730">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#374151"/></marker>
  <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0369a1"/></marker>
  <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker>
  <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#c2410c"/></marker>
  <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#991b1b"/></marker>
</defs>

<!-- Background -->
<rect width="960" height="730" fill="#f8fafc" rx="10"/>

<!-- Title -->
<text x="480" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Architecture llm-module — DocDockGo</text>

<!-- ===================== ORCHESTRATEUR ===================== -->
<rect x="330" y="36" width="240" height="57" rx="8" fill="#475569" stroke="#334155" stroke-width="1.5"/>
<text x="450" y="59" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f1f5f9">Orchestrateur</text>
<text x="450" y="76" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">port 3000 · POST /v1/decision (caller)</text>

<!-- ===================== LLM-DECISION ===================== -->
<rect x="75" y="155" width="315" height="148" rx="8" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5"/>
<text x="232" y="179" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">llm-decision</text>
<text x="232" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#bfdbfe">port 3005 · POST /v1/decision</text>
<line x1="90" y1="202" x2="375" y2="202" stroke="#3b82f6" stroke-width="0.8"/>
<text x="232" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#93c5fd">Phase 1 — Décision · tool calling workers + arbitre</text>
<text x="232" y="234" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#93c5fd">Phase 2 — Exécution · MCP JSON-RPC 2.0</text>
<text x="232" y="250" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#93c5fd">Phase 3a — Analyse · workers + arbitre</text>
<text x="232" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#93c5fd">Phase 3b — Alternatives · si verdict DENY</text>
<text x="232" y="286" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dbeafe">↳ FinalReport JSON retourné à l'orchestrateur</text>

<!-- ===================== LLM-MANAGER ===================== -->
<rect x="525" y="155" width="250" height="107" rx="8" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
