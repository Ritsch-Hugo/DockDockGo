<line x1="390" y1="528" x2="564" y2="528" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="477" y="522" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#7c3aed">health · /v1/models</text>

