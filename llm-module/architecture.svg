<text x="232" y="472" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fdba74">JSON-RPC 2.0 stateless · rate limiting MAX_CONCURRENT_SCANS</text>

<!-- ===================== SCANNERS ===================== -->
