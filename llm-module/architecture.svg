<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790">
<defs>
  <marker id="a0" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
  <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1d4ed8"/></marker>
  <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker>
  <marker id="a3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
  <marker id="a4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
  <marker id="a5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d97706"/></marker>
  <marker id="a6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
</defs>

<!-- Fond -->
<rect width="960" height="790" fill="#f8fafc" rx="10"/>

<!-- Titre -->
<text x="480" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">DocDockGo — Architecture</text>

<!-- ═══════════════════════════════════════════════════
     DOCKER CLIENT
════════════════════════════════════════════════════ -->
<rect x="365" y="42" width="190" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="460" y="59" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Docker Client</text>
<text x="460" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#3b82f6">docker pull image:tag</text>

<!-- ARROW: Docker Client → Proxy -->
<line x1="460" y1="82" x2="460" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#a0)"/>

<!-- ═══════════════════════════════════════════════════
     PROXY DOCKER
════════════════════════════════════════════════════ -->
<rect x="348" y="128" width="224" height="40" rx="7" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="460" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1e293b">Proxy Docker</text>
<text x="460" y="161" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748b">intercepte les pulls · stocke en quarantaine</text>

<!-- ARROW: Proxy → Orchestrateur (notifie) -->
<line x1="446" y1="168" x2="424" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#a0)"/>
<!-- ARROW: Orchestrateur → Proxy (ALLOW/DENY) -->
<line x1="472" y1="220" x2="476" y2="168" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#a1)" stroke-dasharray="3,2"/>
<text x="428" y="198" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#475569">notifie pull</text>
<text x="495" y="198" text-anchor="start" font-family="Arial,sans-serif" font-size="9" fill="#1d4ed8">ALLOW/DENY</text>

<!-- ARROW: Proxy → Quarantaine (écrit artefacts) -->
<path d="M572,148 Q668,138 753,188" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a5)" stroke-dasharray="5,3"/>
<text x="666" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#b45309">écrit artefacts OCI</text>

<!-- ═══════════════════════════════════════════════════
     QUARANTAINE (storage, panneau droit)
════════════════════════════════════════════════════ -->
<rect x="753" y="112" width="172" height="310" rx="7" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="839" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#92400e">Quarantaine</text>
<text x="839" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b45309">filesystem partagé</text>
<line x1="758" y1="156" x2="920" y2="156" stroke="#d97706" stroke-width="0.6" opacity="0.5"/>
<text x="839" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#92400e">{registry}/{repo}/{tag}/</text>
<text x="839" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b45309">├─ manifests/</text>
<text x="839" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b45309">├─ blobs/sha256/</text>
<text x="839" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b45309">├─ referrers/</text>
<text x="839" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b45309">└─ sbom.json</text>
<line x1="758" y1="246" x2="920" y2="246" stroke="#d97706" stroke-width="0.6" opacity="0.5"/>
<text x="839" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#92400e">Accès :</text>
<text x="839" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b45309">Proxy → écrit</text>
<text x="839" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b45309">llm-decision → lit</text>
<text x="839" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b45309">mcp-tools-server → lit</text>

<!-- ═══════════════════════════════════════════════════
     ORCHESTRATEUR
════════════════════════════════════════════════════ -->
<rect x="282" y="222" width="308" height="52" rx="7" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="436" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Orchestrateur</text>
<text x="436" y="261" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1d4ed8">:3000  ·  POST /v1/decision  ·  ALLOW / DENY / PENDING</text>

<!-- ARROW: Orchestrateur → Module HN (dashed, non intégré) -->
<path d="M282,252 L238,343" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#a6)"/>
<text x="244" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">HEAD · réputation</text>

<!-- ARROW: Orchestrateur → llm-decision -->
<line x1="472" y1="274" x2="472" y2="332" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#a1)"/>
<!-- ARROW: llm-decision → Orchestrateur (ScanDecision) -->
<line x1="490" y1="332" x2="490" y2="275" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a2)" stroke-dasharray="3,2"/>
<text x="510" y="307" text-anchor="start" font-family="Arial,sans-serif" font-size="9" fill="#1d4ed8">POST PullContext</text>
<text x="453" y="307" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#7c3aed">ScanDecision</text>

<!-- ═══════════════════════════════════════════════════
     MODULE HAUT NIVEAU (non intégré)
════════════════════════════════════════════════════ -->
<rect x="12" y="345" width="224" height="58" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="124" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#64748b">Module Haut Niveau</text>
<text x="124" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">:4000  ·  réputation / popularité</text>
<text x="124" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ef4444">non encore intégré</text>

<!-- ═══════════════════════════════════════════════════
     LLM-DECISION
════════════════════════════════════════════════════ -->
<rect x="332" y="332" width="304" height="110" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
