<rect x="480" y="436" width="208" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
<text x="584" y="454" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">Worker 3</text>
<text x="584" y="471" text-anchor="middle" font-family="monospace" font-size="9" fill="#7c3aed">google/gemma-4-31b-it</text>

<!-- Arbitre -->
<rect x="703" y="436" width="218" height="44" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="812" y="454" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4c1d95">Arbitre</text>
<text x="812" y="471" text-anchor="middle" font-family="monospace" font-size="9" fill="#6d28d9">mistralai/mistral-small-2603</text>

<text x="702" y="504" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8b5cf6">4 familles distinctes · workers exécutés en parallèle (tokio::join!)</text>
<text x="702" y="518" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8b5cf6">tool_choice: required · fail-safe si 2+ workers échouent → HTTP 503</text>
<text x="702" y="533" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8b5cf6">MiniMax MoE · Qwen thinking · Gemma dense · Mistral reasoning</text>

<!-- ===================== MCP-TOOLS-SERVER ===================== -->
