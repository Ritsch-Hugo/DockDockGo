<text x="650" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7dd3fc">Valide la disponibilité</text>
<text x="650" y="236" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7dd3fc">des modèles LLM au démarrage</text>
<text x="650" y="253" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#bae6fd">GET /health · GET /models</text>

<!-- ===================== OPENROUTER ===================== -->
<rect x="468" y="330" width="468" height="225" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,4"/>
