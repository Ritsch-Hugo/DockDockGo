<rect x="342" y="378" width="72" height="22" rx="4" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
<text x="378" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4c1d95">Worker 1</text>
<rect x="422" y="378" width="72" height="22" rx="4" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
<text x="458" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4c1d95">Worker 2</text>
<rect x="502" y="378" width="72" height="22" rx="4" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
<text x="538" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4c1d95">Worker 3</text>
<!-- Arbitre -->
<rect x="412" y="408" width="95" height="22" rx="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
<text x="460" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#3b0764">Arbitre</text>

<!-- ARROW: llm-decision → Quarantaine (lit artefacts) -->
<path d="M636,362 Q710,338 751,265" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a5)" stroke-dasharray="4,2"/>
<text x="716" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#b45309">lit artefacts</text>

