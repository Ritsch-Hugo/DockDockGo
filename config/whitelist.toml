# Images sans ecosystem = ignorées par le poller OSV pour l'instant.
# Le full-stack alimentera ces entrées avec de vrais SBOMs Trivy
# (versions distro + ecosystem exact, ex: "Alpine:3.18").

[[images]]
name = "nginx:1.25"

[[images.sbom.packages]]
name = "openssl"
version = "3.0.7"

[[images.sbom.packages]]
name = "zlib"
version = "1.2.13"

[[images.sbom.packages]]
name = "libpng"
version = "1.6.37"

[[images]]
name = "redis:7.2"

[[images.sbom.packages]]
name = "openssl"
version = "1.1.1"

[[images.sbom.packages]]
name = "jemalloc"
version = "5.3.0"

[[images]]
name = "postgres:16"

[[images.sbom.packages]]
name = "openssl"
version = "3.0.7"

[[images.sbom.packages]]
name = "libxml2"
version = "2.10.3"

[[images.sbom.packages]]
name = "zlib"
version = "1.2.13"

# Image de démo avec de vrais packages PyPI — permet de valider le polling OSV
# sans attendre les vrais SBOMs. À retirer quand les images réelles sont câblées.

[[images]]
name = "demo-python-app:1.0"

[[images.sbom.packages]]
name = "pillow"
version = "9.0.0"
ecosystem = "PyPI"

[[images.sbom.packages]]
name = "cryptography"
version = "38.0.0"
ecosystem = "PyPI"
