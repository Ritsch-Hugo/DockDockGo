name: CI/CD — mcp-tools-server

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ============================================================
  # Lint — clippy + format
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Rust stable avec clippy et rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mcp-tools-server/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('mcp-tools-server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Vérification du format (rustfmt)
        run: cargo fmt --manifest-path mcp-tools-server/Cargo.toml --all -- --check

      - name: Analyse statique (clippy)
        run: cargo clippy --manifest-path mcp-tools-server/Cargo.toml --all-targets -- -D warnings

  # ============================================================
  # CI — build + tests
  # ============================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mcp-tools-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mcp-tools-server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compiler
        run: cargo build --manifest-path mcp-tools-server/Cargo.toml

      - name: Tests unitaires
        run: cargo test --manifest-path mcp-tools-server/Cargo.toml

  # ============================================================
  # Audit sécurité — RustSec
  # ============================================================
  audit:
    name: Audit sécurité (RustSec)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit des dépendances
        run: cargo audit --file mcp-tools-server/Cargo.lock

  # ============================================================
  # CD — tourne uniquement sur les tags v*
  # ============================================================
  docker:
    name: Build, Scan & Push image Docker
    runs-on: ubuntu-latest
    needs: [test, audit]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir le nom du owner en minuscules
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build mcp-tools-server (sans push)
        uses: docker/build-push-action@v5
        with:
          context: mcp-tools-server
          file: mcp-tools-server/Dockerfile
          push: false
          load: true
          tags: mcp-tools-server:scan

      - name: Scan Trivy — mcp-tools-server
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mcp-tools-server:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Push mcp-tools-server
        uses: docker/build-push-action@v5
        with:
          context: mcp-tools-server
          file: mcp-tools-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/mcp-tools-server:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/mcp-tools-server:latest
