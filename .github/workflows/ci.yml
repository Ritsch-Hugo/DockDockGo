name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            llm-module/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('llm-module/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compiler
        run: cargo build --manifest-path llm-module/Cargo.toml

      - name: Tests unitaires
        run: cargo test --manifest-path llm-module/Cargo.toml
