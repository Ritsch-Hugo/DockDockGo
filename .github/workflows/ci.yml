name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ============================================================
  # CI — tourne à chaque push sur n'importe quelle branche
  # ============================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            llm-module/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('llm-module/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compiler
        run: cargo build --manifest-path llm-module/Cargo.toml

      - name: Tests unitaires
        run: cargo test --manifest-path llm-module/Cargo.toml

  # ============================================================
  # CD — tourne uniquement sur les tags v*
  # ============================================================
  docker:
    name: Build & Push images Docker
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push llm-manager
        uses: docker/build-push-action@v5
        with:
          context: llm-module
          file: llm-module/llm-manager/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llm-manager:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/llm-manager:latest

      - name: Build & Push llm-decision
        uses: docker/build-push-action@v5
        with:
          context: llm-module
          file: llm-module/llm-decision/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llm-decision:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/llm-decision:latest
