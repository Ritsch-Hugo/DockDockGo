name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ============================================================
  # Lint — clippy + format
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Rust stable avec clippy et rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            llm-module/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('llm-module/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Vérification du format (rustfmt)
        run: cargo fmt --manifest-path llm-module/Cargo.toml --all -- --check

      - name: Analyse statique (clippy)
        run: cargo clippy --manifest-path llm-module/Cargo.toml --all-targets -- -D warnings

  # ============================================================
  # CI — build + tests unitaires
  # ============================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            llm-module/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('llm-module/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compiler
        run: cargo build --manifest-path llm-module/Cargo.toml

      - name: Tests unitaires
        run: cargo test --manifest-path llm-module/Cargo.toml

  # ============================================================
  # Audit sécurité — RustSec (vulnérabilités des dépendances)
  # ============================================================
  audit:
    name: Audit sécurité (RustSec)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit des dépendances
        run: cargo audit --file llm-module/Cargo.lock

  # ============================================================
  # CD — tourne uniquement sur les tags v*
  # ============================================================
  docker:
    name: Build, Scan & Push images Docker
    runs-on: ubuntu-latest
    needs: [test, audit]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir le nom du owner en minuscules
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build llm-manager (sans push)
        uses: docker/build-push-action@v5
        with:
          context: llm-module
          file: llm-module/llm-manager/Dockerfile
          push: false
          load: true
          tags: llm-manager:scan

      - name: Scan Trivy — llm-manager
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: llm-manager:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Push llm-manager
        uses: docker/build-push-action@v5
        with:
          context: llm-module
          file: llm-module/llm-manager/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/llm-manager:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/llm-manager:latest

      - name: Build llm-decision (sans push)
        uses: docker/build-push-action@v5
        with:
          context: llm-module
          file: llm-module/llm-decision/Dockerfile
          push: false
          load: true
          tags: llm-decision:scan

      - name: Scan Trivy — llm-decision
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: llm-decision:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Push llm-decision
        uses: docker/build-push-action@v5
        with:
          context: llm-module
          file: llm-module/llm-decision/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/llm-decision:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/llm-decision:latest
