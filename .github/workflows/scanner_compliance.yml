name: Rust (scanner_compliance)

on:
  push:
    branches: ["feature/compliance"]
  pull_request:
    branches: ["feature/compliance"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: rust-scanner-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner_compliance

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            scanner_compliance -> target

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --verbose --all-features

      - name: Tests
        run: cargo test --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features

  rustsec_audit:
    name: RustSec (cargo audit)
    runs-on: ubuntu-latest
    needs: [checks]
    defaults:
      run:
        working-directory: scanner_compliance

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            scanner_compliance -> target

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec audit
        run: cargo audit

  docker:
    runs-on: ubuntu-latest
    needs: [checks]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="ghcr.io/${{ github.repository_owner }}/scanner-compliance"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "sha=${IMAGE}:sha-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "latest=${IMAGE}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t ${{ steps.tags.outputs.sha }} .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tags.outputs.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        if: github.event_name == 'push'
        run: |
          docker push ${{ steps.tags.outputs.sha }}
          docker tag ${{ steps.tags.outputs.sha }} ${{ steps.tags.outputs.latest }}
          docker push ${{ steps.tags.outputs.latest }}