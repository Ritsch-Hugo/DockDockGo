name: Rust (scanner_cve)

on:
  push:
    branches: ["Static-scan"]
  pull_request:
    branches: ["Static-scan"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: rust-scanner-cve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner_cve

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            scanner_cve -> target

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --verbose --all-features

      - name: Tests
        run: cargo test --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features

  rustsec_audit:
    name: RustSec (cargo audit)
    runs-on: ubuntu-latest
    needs: [checks]
    defaults:
      run:
        working-directory: scanner_cve

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            scanner_cve -> target

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec audit
        run: cargo audit

  docker:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: [checks, rustsec_audit]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/ritsch-hugo/dockdockgo/scanner-cve:sha-${{ github.sha }} \
            -t ghcr.io/ritsch-hugo/dockdockgo/scanner-cve:latest \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/ritsch-hugo/dockdockgo/scanner-cve:sha-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - name: Push to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/ritsch-hugo/dockdockgo/scanner-cve:sha-${{ github.sha }}
          docker push ghcr.io/ritsch-hugo/dockdockgo/scanner-cve:latest
