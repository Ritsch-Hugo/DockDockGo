[package]
name = "scanner_cve"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tar = "0.4"
flate2 = "1.0"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }