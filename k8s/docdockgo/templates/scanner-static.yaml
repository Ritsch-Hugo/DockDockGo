---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trivy-db
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.trivyDb.size }}
---
# Job one-shot : télécharge la DB Trivy avant le démarrage du scanner
apiVersion: batch/v1
kind: Job
metadata:
  name: trivy-db-init
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "docdockgo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: trivy-db-init
          image: aquasec/trivy:0.70.0
          args: ["image", "--download-db-only", "--db-repository", "ghcr.io/aquasecurity/trivy-db"]
          volumeMounts:
            - name: trivy-db
              mountPath: /root/.cache/trivy
      volumes:
        - name: trivy-db
          persistentVolumeClaim:
            claimName: trivy-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-static
  namespace: {{ .Values.namespace }}
  labels:
    app: scanner-static
    {{- include "docdockgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scanner-static
  template:
    metadata:
      labels:
        app: scanner-static
    spec:
      containers:
        - name: scanner-static
          image: {{ .Values.scannerStatic.image.repository }}:{{ .Values.scannerStatic.image.tag }}
          envFrom:
            - secretRef:
                name: scanner-static-env
          ports:
            - containerPort: 3002
          volumeMounts:
            - name: trivy-db
              mountPath: /root/.cache/trivy
      volumes:
        - name: trivy-db
          persistentVolumeClaim:
            claimName: trivy-db
---
apiVersion: v1
kind: Service
metadata:
  name: scanner-static
  namespace: {{ .Values.namespace }}
  labels:
    app: scanner-static
    {{- include "docdockgo.labels" . | nindent 4 }}
spec:
  selector:
    app: scanner-static
  ports:
    - port: 3002
      targetPort: 3002
