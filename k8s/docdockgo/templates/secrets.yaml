# Un Secret par service contenant toutes ses variables d'environnement.
# Les valeurs sensibles (API keys, passwords) doivent être surchargées
# dans values-secret.yaml (jamais committé).

---
apiVersion: v1
kind: Secret
metadata:
  name: proxy-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "docdockgo.databaseUrl" . | quote }}
  MAX_BLOB_SIZE: {{ .Values.proxy.config.maxBlobSize | quote }}
  MAX_CONCURRENT_PULLS: {{ .Values.proxy.config.maxConcurrentPulls | quote }}
  CONTEXT_TIMEOUT: {{ .Values.proxy.config.contextTimeout | quote }}
  ORCH_URL: "http://orchestrateur:3000/v1/decision"
  ORCH_TIMEOUT_SECS: {{ .Values.proxy.config.orchTimeoutSecs | quote }}
  SHUTDOWN_DRAIN_TIMEOUT_SECS: {{ .Values.proxy.config.shutdownDrainTimeout | quote }}
  QUARANTINE_BASE: {{ .Values.proxy.config.quarantineBase | quote }}
  CACHE_BASE: {{ .Values.proxy.config.cacheBase | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: orchestrateur-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "docdockgo.databaseUrl" . | quote }}
  BIND_ADDR: "0.0.0.0:3000"
  HIGH_LEVEL_URL: "http://scanner-haut-niveau:4000/v1/high-level"
  LLM_DECISION_URL: "http://llm-decision:3005/v1/decision"
  RUST_LOG: "info,tower_http=info"
  QUARANTINE_BASE: "/app/quarantaine"
  CACHE_BASE: "/app/cache"
  HL_TIMEOUT_SECS: {{ .Values.orchestrateur.config.hlTimeoutSecs | quote }}
  LLM_DECISION_TIMEOUT_SECS: {{ .Values.orchestrateur.config.llmDecisionTimeoutSecs | quote }}
  HL_ALLOW_THRESHOLD: {{ .Values.orchestrateur.config.hlAllowThreshold | quote }}
  HL_DENY_THRESHOLD: {{ .Values.orchestrateur.config.hlDenyThreshold | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: scanner-haut-niveau-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ .Values.scannerHautNiveau.geminiApiKey | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: scanner-compliance-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  PORT: {{ .Values.scannerCompliance.config.port | quote }}
  RATE_LIMIT_PER_SECOND: {{ .Values.scannerCompliance.config.rateLimitPerSecond | quote }}
  RATE_LIMIT_BURST: {{ .Values.scannerCompliance.config.rateLimitBurst | quote }}
  QUARANTINE_BASE: "/quarantaine"

---
apiVersion: v1
kind: Secret
metadata:
  name: scanner-static-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  PORT: {{ .Values.scannerStatic.config.port | quote }}
  RUST_LOG: {{ .Values.scannerStatic.config.rustLog | quote }}
  RATE_LIMIT_RPS: {{ .Values.scannerStatic.config.rateLimitRps | quote }}
  MAX_CONCURRENT_SCANS: {{ .Values.scannerStatic.config.maxConcurrentScans | quote }}
  TRIVY_TIMEOUT_SECS: {{ .Values.scannerStatic.config.trivyTimeoutSecs | quote }}
  TRIVY_SKIP_DB_UPDATE: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-tools-server-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MCP_SERVER_PORT: {{ .Values.mcpToolsServer.config.port | quote }}
  STATIC_SCANNER_URL: "http://scanner-static:3002"
  COMPLIANCE_SCANNER_URL: "http://scanner-compliance:3001"
  MAX_CONCURRENT_SCANS: {{ .Values.mcpToolsServer.config.maxConcurrentScans | quote }}
  SCANNER_TIMEOUT_SECS: {{ .Values.mcpToolsServer.config.scannerTimeoutSecs | quote }}
  MAX_BLOB_SIZE_BYTES: {{ .Values.mcpToolsServer.config.maxBlobSizeBytes | quote }}
  MAX_REQUEST_BODY_BYTES: {{ .Values.mcpToolsServer.config.maxRequestBodyBytes | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: llm-manager-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  LLM_BASE_URL: {{ .Values.llmManager.config.llmBaseUrl | quote }}
  OPENROUTER_API_KEY: {{ .Values.llmManager.openrouterApiKey | quote }}
  LLM_WORKER_1: {{ .Values.llmManager.config.worker1 | quote }}
  LLM_WORKER_2: {{ .Values.llmManager.config.worker2 | quote }}
  LLM_WORKER_3: {{ .Values.llmManager.config.worker3 | quote }}
  LLM_ARBITER: {{ .Values.llmManager.config.arbiter | quote }}
  LLM_TIMEOUT_SECS: {{ .Values.llmManager.config.timeoutSecs | quote }}
  MANAGER_PORT: {{ .Values.llmManager.config.managerPort | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: llm-decision-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  LLM_BASE_URL: {{ .Values.llmManager.config.llmBaseUrl | quote }}
  OPENROUTER_API_KEY: {{ .Values.llmManager.openrouterApiKey | quote }}
  LLM_WORKER_1: {{ .Values.llmManager.config.worker1 | quote }}
  LLM_WORKER_2: {{ .Values.llmManager.config.worker2 | quote }}
  LLM_WORKER_3: {{ .Values.llmManager.config.worker3 | quote }}
  LLM_ARBITER: {{ .Values.llmManager.config.arbiter | quote }}
  LLM_TIMEOUT_SECS: {{ .Values.llmManager.config.timeoutSecs | quote }}
  DECISION_PORT: {{ .Values.llmDecision.config.decisionPort | quote }}
  MANAGER_PORT: {{ .Values.llmManager.config.managerPort | quote }}
  MANAGER_HOST: "llm-manager"
  MCP_SERVER_URL: "http://localhost:3004/mcp"
  STARTUP_MAX_RETRIES: {{ .Values.llmDecision.config.startupMaxRetries | quote }}
  STARTUP_RETRY_DELAY_SECS: {{ .Values.llmDecision.config.startupRetryDelaySecs | quote }}
  MAX_REQUEST_BODY_BYTES: {{ .Values.llmDecision.config.maxRequestBodyBytes | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: cycle-de-vie-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "docdockgo.databaseUrl" . | quote }}
  PORT: {{ .Values.cycleDeVie.config.port | quote }}
  POLL_INTERVAL_SECS: {{ .Values.cycleDeVie.config.pollIntervalSecs | quote }}
  SBOM_DIR: {{ .Values.cycleDeVie.config.sbomDir | quote }}
  SYFT_BIN: {{ .Values.cycleDeVie.config.syftBin | quote }}
  DASHBOARD_URL: "http://dashboard:3010/notifications"

---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "docdockgo.databaseUrl" . | quote }}
  LISTEN_ADDR: {{ .Values.dashboard.config.listenAddr | quote }}
  ALLOWED_IPS: {{ .Values.dashboard.config.allowedIps | quote }}
  ZITADEL_ISSUER: {{ .Values.dashboard.oidc.issuer | quote }}
  CLIENT_ID: {{ .Values.dashboard.oidc.clientId | quote }}
  REDIRECT_URI: {{ .Values.dashboard.oidc.redirectUri | quote }}
  POST_LOGOUT_REDIRECT_URI: {{ .Values.dashboard.oidc.postLogoutRedirectUri | quote }}
