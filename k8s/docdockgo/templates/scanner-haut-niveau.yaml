---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-haut-niveau
  namespace: {{ .Values.namespace }}
  labels:
    app: scanner-haut-niveau
    {{- include "docdockgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scanner-haut-niveau
  template:
    metadata:
      labels:
        app: scanner-haut-niveau
    spec:
      containers:
        - name: scanner-haut-niveau
          image: {{ .Values.scannerHautNiveau.image.repository }}:{{ .Values.scannerHautNiveau.image.tag }}
          envFrom:
            - secretRef:
                name: scanner-haut-niveau-env
          ports:
            - containerPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: scanner-haut-niveau
  namespace: {{ .Values.namespace }}
  labels:
    app: scanner-haut-niveau
    {{- include "docdockgo.labels" . | nindent 4 }}
spec:
  selector:
    app: scanner-haut-niveau
  ports:
    - port: 4000
      targetPort: 4000
