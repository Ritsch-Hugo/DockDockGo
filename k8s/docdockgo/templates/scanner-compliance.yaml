---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-compliance
  namespace: {{ .Values.namespace }}
  labels:
    app: scanner-compliance
    {{- include "docdockgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scanner-compliance
  template:
    metadata:
      labels:
        app: scanner-compliance
    spec:
      containers:
        - name: scanner-compliance
          image: {{ .Values.scannerCompliance.image.repository }}:{{ .Values.scannerCompliance.image.tag }}
          envFrom:
            - secretRef:
                name: scanner-compliance-env
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: quarantaine
              mountPath: /quarantaine
      volumes:
        - name: quarantaine
          persistentVolumeClaim:
            claimName: quarantaine

---
apiVersion: v1
kind: Service
metadata:
  name: scanner-compliance
  namespace: {{ .Values.namespace }}
  labels:
    app: scanner-compliance
    {{- include "docdockgo.labels" . | nindent 4 }}
spec:
  selector:
    app: scanner-compliance
  ports:
    - port: 3001
      targetPort: 3001
