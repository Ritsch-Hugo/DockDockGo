# Le proxy TLS MITM a besoin de :
# - Les certificats dans un Secret "proxy-certs" (créer manuellement via scripts/create-certs-secret.sh)
# - Les volumes quarantaine et cache
# - Un NodePort 443 → 8443 pour intercepter les pulls Docker

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: proxy
    {{- include "docdockgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          image: {{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}
          envFrom:
            - secretRef:
                name: proxy-env
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: certs
              mountPath: /app/certs-mitm
              readOnly: true
            - name: registry-whitelist
              mountPath: /app/registry_whitelist.json
              subPath: registry_whitelist.json
              readOnly: true
            - name: quarantaine
              mountPath: /app/quarantaine
            - name: cache
              mountPath: /app/cache
            - name: dotenv
              mountPath: /app/.env
              subPath: .env
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: proxy-certs
        - name: registry-whitelist
          configMap:
            name: registry-whitelist
        - name: quarantaine
          persistentVolumeClaim:
            claimName: quarantaine
        - name: cache
          persistentVolumeClaim:
            claimName: cache
        - name: dotenv
          configMap:
            name: proxy-dotenv

---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: proxy
    {{- include "docdockgo.labels" . | nindent 4 }}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: proxy
  ports:
    - port: 8443
      targetPort: 8443
      nodePort: {{ .Values.proxy.service.nodePort }}
