---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-dotenv
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "docdockgo.labels" . | nindent 4 }}
data:
  .env: |
    DATABASE_URL={{ include "docdockgo.databaseUrl" . }}
    MAX_BLOB_SIZE={{ .Values.proxy.config.maxBlobSize }}
    MAX_CONCURRENT_PULLS={{ .Values.proxy.config.maxConcurrentPulls }}
    CONTEXT_TIMEOUT={{ .Values.proxy.config.contextTimeout }}
    ORCH_URL=http://orchestrateur:3000/v1/decision
    ORCH_TIMEOUT_SECS={{ .Values.proxy.config.orchTimeoutSecs }}
    SHUTDOWN_DRAIN_TIMEOUT_SECS={{ .Values.proxy.config.shutdownDrainTimeout }}
    QUARANTINE_BASE={{ .Values.proxy.config.quarantineBase }}
    CACHE_BASE={{ .Values.proxy.config.cacheBase }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-sql
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "docdockgo.labels" . | nindent 4 }}
data:
  init.sql: |
{{ .Files.Get "files/init.sql" | indent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-whitelist
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "docdockgo.labels" . | nindent 4 }}
data:
  registry_whitelist.json: |
{{ .Files.Get "files/registry_whitelist.json" | indent 4 }}
