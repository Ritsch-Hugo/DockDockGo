[package]
name = "DockDockGo"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

# Crypto / utils
bytes = "1"
sha2 = "0.10"
rand = "0.8"

# HTTP client (multipart requis)
reqwest = { version = "0.11", features = ["json", "multipart", "rustls-tls"] }

# Buffer / state global (prototype)
dashmap = "6"
once_cell = "1"
base64 = "0.22"
openidconnect = "3.4.0"
