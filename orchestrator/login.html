<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion</title>
</head>
<body>
  <h1>Connexion</h1>

  <form action="/login" method="post">
    <label>
      Utilisateur :
      <input type="text" name="username" required />
    </label>
    <br><br>

    <label>
      Mot de passe :
      <input type="password" name="password" required />
    </label>
    <br><br>

    <button type="submit">Se connecter</button>
  </form>
</body>
</html>
