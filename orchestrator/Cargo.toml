[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orchestrator"
path = "main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
bytes = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["limit"] }
uuid = { version = "1", features = ["v4", "serde"] }
